name: Evisort
kind: company
description: Evisort is an AI-powered contract lifecycle management (CLM) and contract
  intelligence platform that lets teams upload, search, and extract data from contracts,
  and automate contract generation and review workflows. Evisort was acquired by Workday
  in 2024 and is now offered as Workday Contract Lifecycle Management, powered by Evisort.
  Its REST API supports document upload and retrieval, field and metadata extraction,
  search, workflow automation, and webhooks, authenticated with an Evisort API key
  exchanged for a JWT bearer token.
